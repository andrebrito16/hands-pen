<!doctype html>
<html lang="pt-BR">
  <head>
    <title>handpen</title>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        margin: 0;
        background: #050301;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      video {
        display: none;
      }
      canvas {
        width: 100%;
        height: 100%;
        transform: scaleX(-1);
        position: absolute;
        z-index: 1;
      }
      .ui-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 1rem 1.5rem;
        padding: 0.75rem 1rem;
        background: linear-gradient(
          to top,
          rgba(5, 3, 1, 0.92),
          rgba(5, 3, 1, 0.55)
        );
        pointer-events: auto;
      }
      .color-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.875rem;
      }
      .color-row label {
        cursor: pointer;
        user-select: none;
      }
      .color-row input[type="color"] {
        width: 2.25rem;
        height: 2rem;
        padding: 0;
        border: 1px solid rgba(125, 211, 252, 0.45);
        border-radius: 6px;
        cursor: pointer;
        background: transparent;
      }
      .color-row input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }
      .color-row input[type="color"]::-webkit-color-swatch {
        border-radius: 4px;
        border: none;
      }
      .attrib {
        color: rgba(255, 255, 255, 0.75);
        font-size: 0.8125rem;
        text-align: center;
      }
      .attrib a {
        color: #7dd3fc;
        text-decoration: none;
      }
      .attrib a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <video id="vid"></video>
    <canvas id="c"></canvas>
    <div class="ui-bar">
      <div class="color-row">
        <label for="pen-color">Cor da caneta</label>
        <input
          type="color"
          id="pen-color"
          value="#7DD3FC"
          title="Cor do traço"
        />
      </div>
      <p class="attrib">
        Com ❤️ por
        <a
          href="https://www.instagram.com/andrebrito.dev/"
          target="_blank"
          rel="noopener noreferrer"
          >@andrebrito.dev</a
        >
      </p>
    </div>
    <script>
      var vid = document.getElementById("vid");
      var c = document.getElementById("c");
      var ctx = c.getContext("2d");
      var arr = [];
      var cur = [];
      var shift = false;
      var draw = false;
      var sx = null;
      var sy = null;

      var penColorEl = document.getElementById("pen-color");
      var penColor = penColorEl.value;

      var skCanvas = document.createElement("canvas");
      var skCtx = skCanvas.getContext("2d");

      function hexToRgb(hex) {
        var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return m
          ? {
              r: parseInt(m[1], 16),
              g: parseInt(m[2], 16),
              b: parseInt(m[3], 16),
            }
          : { r: 125, g: 211, b: 252 };
      }

      function rgbaFromPen(alpha) {
        var rgb = hexToRgb(penColor);
        return "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + "," + alpha + ")";
      }

      penColorEl.oninput = function () {
        penColor = penColorEl.value;
      };

      /** Encaixa o quadro da câmera na janela sem esticar (contain): barras nas laterais ou acima/abaixo. */
      function cameraLayout() {
        var vw = vid.videoWidth || 1280;
        var vh = vid.videoHeight || 720;
        var cw = window.innerWidth;
        var ch = window.innerHeight;
        var va = vw / vh;
        var wa = cw / ch;
        var drawW, drawH, ox, oy;
        if (wa > va) {
          drawH = ch;
          drawW = ch * va;
          ox = (cw - drawW) / 2;
          oy = 0;
        } else {
          drawW = cw;
          drawH = cw / va;
          ox = 0;
          oy = (ch - drawH) / 2;
        }
        return {
          vw: vw,
          vh: vh,
          cw: cw,
          ch: ch,
          drawW: drawW,
          drawH: drawH,
          ox: ox,
          oy: oy,
        };
      }

      window.onkeydown = function (e) {
        if (e.key == "Shift") shift = true;
        if (e.code == "Space") arr = [];
      };

      window.onkeyup = function (e) {
        if (e.key == "Shift") shift = false;
      };

      function run(res) {
        var L = cameraLayout();
        c.width = L.cw;
        c.height = L.ch;

        ctx.fillStyle = "#050301";
        ctx.fillRect(0, 0, L.cw, L.ch);
        ctx.drawImage(
          res.image,
          0,
          0,
          L.vw,
          L.vh,
          L.ox,
          L.oy,
          L.drawW,
          L.drawH,
        );
        ctx.fillStyle = "rgba(10, 6, 2, 0.85)";
        ctx.fillRect(0, 0, L.cw, L.ch);

        ctx.shadowColor = penColor;
        ctx.shadowBlur = 15;
        ctx.strokeStyle = penColor;
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        for (var i = 0; i < arr.length; i++) {
          ctx.beginPath();
          for (var j = 0; j < arr[i].length; j++) {
            if (j == 0) ctx.moveTo(arr[i][j].x, arr[i][j].y);
            else ctx.lineTo(arr[i][j].x, arr[i][j].y);
          }
          ctx.stroke();
        }

        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
          var lm = res.multiHandLandmarks[0];
          var dw = Math.max(1, Math.round(L.drawW));
          var dh = Math.max(1, Math.round(L.drawH));
          skCanvas.width = dw;
          skCanvas.height = dh;
          drawConnectors(skCtx, lm, HAND_CONNECTIONS, {
            color: rgbaFromPen(0.3),
            lineWidth: 2,
          });
          drawLandmarks(skCtx, lm, {
            color: "#FFFFFF",
            lineWidth: 1,
            radius: 2,
          });
          ctx.drawImage(skCanvas, L.ox, L.oy);

          var ind = lm[8];
          var rx = L.ox + ind.x * L.drawW;
          var ry = L.oy + ind.y * L.drawH;

          if (sx == null) {
            sx = rx;
            sy = ry;
          } else {
            sx += (rx - sx) * 0.45;
            sy += (ry - sy) * 0.45;
          }

          ctx.beginPath();
          ctx.arc(sx, sy, 6, 0, 2 * Math.PI);
          if (shift) {
            ctx.fillStyle = "#FFFFFF";
          } else {
            ctx.fillStyle = rgbaFromPen(0.4);
          }
          ctx.fill();

          if (shift) {
            if (!draw) {
              draw = true;
              cur = [];
              arr.push(cur);
            }
            cur.push({ x: sx, y: sy });
          } else {
            draw = false;
          }
        } else {
          draw = false;
          sx = null;
        }
      }

      var h = new Hands({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        },
      });

      h.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });

      h.onResults(run);

      var cam = new Camera(vid, {
        onFrame: async () => {
          await h.send({ image: vid });
        },
        width: 1280,
        height: 720,
      });

      cam.start();
    </script>
  </body>
</html>
